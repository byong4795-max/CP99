// 記住最近的聊天內容。
// 只在目前這次開啟網頁期間有效。
// 不會將聊天內容傳送到外部伺服器。

let conversationHistory = [];

let lastTopic = "";

let lastBotReply = "";

function remember(sender, text) {

    conversationHistory.push({
        sender: sender,
        text: text,
        time: Date.now()
    });

    // 只保留最近20筆

    if (conversationHistory.length > 20) {
        conversationHistory.shift();
    }

}

function getLastUserMessage() {

    const messages = conversationHistory.filter(
        item => item.sender === "user"
    );

    return messages.length
        ? messages[messages.length - 1].text
        : "";

}

function getLastBotMessage() {

    const messages = conversationHistory.filter(
        item => item.sender === "bot"
    );

    return messages.length
        ? messages[messages.length - 1].text
        : "";

}


// ==================================================
// 6. 基礎文字處理
// ==================================================

function normalize(text) {

    return text
        .toLowerCase()
        .replace(/[？?！!，,。．.、～~…]/g, "")
        .replace(/\s+/g, "")
        .trim();

}

function randomItem(array) {

    return array[
        Math.floor(Math.random() * array.length)
    ];

}


// ==================================================
// 7. 知識庫搜尋
// ==================================================

function findKnowledgeAnswer(question) {

    const normalized = normalize(question);

    const matchedGroups = [];

    knowledgeBase.forEach(item => {

        if (!Array.isArray(item.keywords)) return;

        let matchedKeywords = [];

        item.keywords.forEach(keyword => {

            if (
                !keyword ||
                keyword.includes("｛") ||
                keyword.includes("{")
            ) return;

            const key = normalize(keyword);

            if (key && normalized.includes(key)) {
                matchedKeywords.push(key);
            }

        });

        if (matchedKeywords.length > 0) {

            // 長關鍵字優先，減少模糊匹配

            const score = Math.max(
                ...matchedKeywords.map(key => key.length)
            ) * 2 + matchedKeywords.length;

            matchedGroups.push({
                item: item,
                score: score
            });

        }

    });

    if (matchedGroups.length === 0) {
        return null;
    }

    matchedGroups.sort((a, b) => b.score - a.score);

    // 只取分數最高的資料組
    // 避免不相關的回答混在一起

    const bestScore = matchedGroups[0].score;

    const bestGroups = matchedGroups.filter(
        group => group.score === bestScore
    );

    const allAnswers = bestGroups.flatMap(
        group => group.item.answers || []
    ).filter(answer => {

        return answer &&
            typeof answer.text === "string" &&
            answer.text.length > 0 &&
            !answer.text.includes("｛請填寫");

    });

    if (allAnswers.length === 0) {
        return null;
    }

    const selected = randomItem(allAnswers);

    return {
        text: selected.text,
        image: selected.image,
        topic: bestGroups[0].item.topic
    };

}

function detectIntent(question) {

    const text = normalize(question);

    let matches = [];

    for (const intent in intentPatterns) {

        const keywords = intentPatterns[intent];

        const matched = keywords.some(keyword => {

            return text.includes(normalize(keyword));

        });

        if (matched) {
            matches.push(intent);
        }

    }

    // 依照優先順序判斷

    const priority = [
        "joke",
        "comfort",
        "insult",
        "praise",
        "thanks",
        "mood",
        "greeting",
        "self",
        "cp",
        "ginger"
    ];

    for (const intent of priority) {

        if (matches.includes(intent)) {
            return intent;
        }

    }

    return "casual";

}


// ==================================================
// 9. 上下文理解
// ==================================================

function understandContext(question) {

    const text = normalize(question);

    const pronouns = [
        "那他呢",
        "那她呢",
        "他呢",
        "她呢",
        "那另一個呢",
        "另一個呢",
        "那他們呢",
        "然後呢",
        "之後呢",
        "真的假的",
        "為什麼",
        "然後"
    ];

    const isFollowUp = pronouns.some(
        word => text.includes(normalize(word))
    );

    if (isFollowUp && lastTopic) {

        if (lastTopic === "麻札") {
            return "你是接著問麻札嗎？嘿嘿，我們剛才聊到他呢！";
        }

        if (lastTopic === "路馬娜") {
            return "你是接著問路馬娜嗎？我有在聽喔！";
        }

        if (lastTopic === "麻路CP") {
            return "你還想繼續聊麻路嗎？這個我最擅長了！";
        }

        return "你是接著剛剛的話題問嗎？我有在努力跟上喔！";
    }

    return null;

}


// ==================================================
// 10. 產生自然對話
// ==================================================

function generatePersonalityReply(question) {

    const intent = detectIntent(question);

    let answer = "";

    switch (intent) {

        case "joke":

            // 冷笑話不會每次都一樣

            if (Math.random() < 0.25) {
                answer = randomItem(personality.ginger);
            } else {
                answer = randomItem(personality.jokes);
            }

            break;


        case "greeting":

            answer = randomItem(personality.greeting);
            break;


        case "mood":

            answer = randomItem(personality.mood);
            break;


        case "praise":

            answer = randomItem(personality.praise);
            break;


        case "insult":

            answer = randomItem(personality.insult);
            break;


        case "thanks":

            answer = randomItem(personality.thanks);
            break;


        case "comfort":

            answer = randomItem(personality.comfort);
            break;


        case "self":

            answer = randomItem(personality.self);
            break;


        case "cp":

            answer = randomItem(personality.cp);
            break;


        case "ginger":

            answer = randomItem(personality.ginger);
            break;


        default:

            // 一般聊天不會永遠只回答「我不知道」

            const random = Math.random();

            if (random < 0.25) {
                answer = randomItem(personality.casual);
            }

            else if (random < 0.45) {
                answer = randomItem(personality.cp);
            }

            else if (random < 0.65) {
                answer = randomItem(personality.ginger);
            }

            else if (random < 0.85) {
                answer = randomItem(personality.confused);
            }

            else {
                answer = randomItem(personality.casual);
            }

            break;

    }

    // 避免連續兩次出現相同回答

    if (answer === lastBotReply) {

        const pool = personality[intent] || personality.casual;

        answer = randomItem(
            pool.filter(item => item !== lastBotReply)
        ) || answer;

    }

    return {
        text: answer,
        image: null,
        topic: null
    };

}


// ==================================================
// 11. 綜合回答判斷
// ==================================================

function findAnswer(question) {

    // 第一優先：原有知識資料庫

    const knowledgeAnswer = findKnowledgeAnswer(question);

    if (knowledgeAnswer) {

        lastTopic = knowledgeAnswer.topic;

        return knowledgeAnswer;

    }

    // 第二優先：上下文理解

    const contextAnswer = understandContext(question);

    if (contextAnswer) {

        return {
            text: contextAnswer,
            image: null,
            topic: null
        };

    }

    // 第三優先：個性與情境判斷

    const personalityAnswer =
        generatePersonalityReply(question);

    // 偶爾加入自然反問，讓對話不會太像單向問答

    if (
        detectIntent(question) === "casual" &&
        Math.random() < 0.3
    ) {

        personalityAnswer.text += "\n\n" +
            "對了，你呢？你怎麼看？";

    }

    return personalityAnswer;

}

// ==================================================
// 14. 傳送訊息
// ==================================================

let replyTimer = null;

function sendMessage() {

    const input =
        document.getElementById("userInput");

    const text = input.value.trim();

    if (text === "") return;

    addMessage("user", text);

    remember("user", text);

    input.value = "";

    if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
    }

    if (replyTimer) {
        clearTimeout(replyTimer);
    }

    document.getElementById("statusText").textContent =
        "姜不應正在思考……";

    replyTimer = setTimeout(() => {

        const response = findAnswer(text);

        addMessage(
            "bot",
            response.text,
            response.image
        );

        remember("bot", response.text);

        lastBotReply = response.text;

        document.getElementById("statusText").textContent =
            "歡迎繼續提問";

        replyTimer = null;

    }, botSettings.replyDelay);

}


// ==================================================
// 15. 顯示聊天訊息
// ==================================================

function addMessage(sender, text, image = null) {

    const chatBox =
        document.getElementById("chatBox");

    const row = document.createElement("div");

    row.className =
        "message-row " +
        (sender === "user" ? "user-row" : "bot-row");

    const message = document.createElement("div");

    message.className =
        "message " +
        (sender === "user"
            ? "user-message"
            : "bot-message");

    message.textContent = text;

    // 顯示圖片

    if (
        image &&
        typeof image === "string" &&
        !image.includes("｛") &&
        !image.includes("{")
    ) {

        const img = document.createElement("img");

        img.src = image;

        img.alt = "角色圖片";

        img.onerror = function() {
            this.style.display = "none";
        };

        message.appendChild(img);

    }

    row.appendChild(message);

    // 時間

    const time = document.createElement("div");

    time.className = "time";

    time.textContent = new Date().toLocaleTimeString(
        "zh-TW",
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

    row.appendChild(time);

    // 機器人語音朗讀按鈕

    if (sender === "bot") {

        const speakButton = document.createElement("button");

        speakButton.className = "speak-button";

        speakButton.textContent = "🔊 朗讀";

        speakButton.onclick = function() {
            speakText(text);
        };

        row.appendChild(speakButton);

    }

    chatBox.appendChild(row);

    chatBox.scrollTop = chatBox.scrollHeight;

}


// ==================================================
// 16. 語音朗讀
// ==================================================

function speakText(text) {

    if (!("speechSynthesis" in window)) {

        alert("你的瀏覽器不支援語音朗讀。");

        return;

    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(text);

    utterance.lang = botSettings.speechLanguage;

    utterance.rate = botSettings.speechRate;

    window.speechSynthesis.speak(utterance);

}


// ==================================================
// 17. 語音輸入
// ==================================================

let recognition = null;

function startVoiceInput() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        alert("目前瀏覽器不支援語音輸入，請使用 Chrome。");

        return;

    }

    if (recognition) {

        recognition.stop();

        recognition = null;

    }

    recognition = new SpeechRecognition();

    recognition.lang = "zh-TW";

    recognition.continuous = false;

    recognition.interimResults = false;

    const micButton =
        document.getElementById("micButton");

    recognition.onstart = function() {

        micButton.classList.add("listening");

        document.getElementById("statusText").textContent =
            "正在聆聽……";

    };

    recognition.onresult = function(event) {

        const result =
            event.results[0][0].transcript;

        document.getElementById("userInput").value =
            result;

        sendMessage();

    };

    recognition.onerror = function() {

        document.getElementById("statusText").textContent =
            "語音辨識發生問題，請再試一次。";

    };

    recognition.onend = function() {

        micButton.classList.remove("listening");

        if (
            document.getElementById("statusText").textContent ===
            "正在聆聽……"
        ) {

            document.getElementById("statusText").textContent =
                "歡迎繼續提問";

        }

    };

    recognition.start();

}
